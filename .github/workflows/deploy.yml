name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "codex/restaurant-rookie-live"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify game rules, art, and public pages
        run: |
          node tests/four-shifts-rules.test.mjs
          node tests/four-shifts-art.test.mjs
          node tests/site-validation.test.cjs

      - name: Play through the game in Chrome
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SCREENSHOT_DIR: ${{ runner.temp }}
        run: node tests/four-shifts-browser.test.mjs

      - name: Save browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-rookie-browser-checks
          path: ${{ runner.temp }}/restaurant-rookie-*.png
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
