<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bearing has moved — Lucinuo</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="canonical" href="https://lucinuo.github.io/bearing/">
  <noscript><meta http-equiv="refresh" content="0; url=/bearing/"></noscript>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #f7f7f3; color: #111311; }
    main { width: min(620px, calc(100% - 40px)); }
    p { color: #62665f; font-size: 18px; line-height: 1.65; }
    a { color: #315c4d; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #111411; color: #eff1ec; } p { color: #aab0a9; } a { color: #8cb7a7; } }
  </style>
  <script>
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter((registration) => registration.scope.includes("/growth-compass/")).map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.filter((name) => name.startsWith("growth-compass-")).map((name) => caches.delete(name)));
        }
      } finally {
        location.replace("/bearing/");
      }
    })();
  </script>
</head>
<body>
  <main>
    <p>Lucinuo / Bearing</p>
    <h1>Bearing has moved.</h1>
    <p>Your records are not being deleted. You are being redirected to the new Bearing page.</p>
    <p><a href="/bearing/">Continue to Bearing →</a></p>
  </main>
</body>
</html>
