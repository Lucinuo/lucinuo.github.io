<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe6d4">
  <meta name="description" content="《餐廳菜鳥》是一款餐廳工作模擬遊戲：接單、煮麵、擺盤、送餐，同時處理收桌、補水與臨時支援。">
  <title>餐廳菜鳥 — Lucinuo</title>
  <link rel="canonical" href="https://lucinuo.github.io/four-shifts/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lucinuo.github.io/four-shifts/">
  <meta property="og:title" content="餐廳菜鳥 — Lucinuo">
  <meta property="og:description" content="接單、煮麵、擺盤、送餐；在忙碌的班次裡熟悉流程，慢慢找到自己的工作節奏。">
  <meta property="og:image" content="https://lucinuo.github.io/four-shifts/assets/restaurant.webp">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main class="game-shell" data-game>
    <header class="game-header">
      <h1>餐廳菜鳥</h1>
      <a href="/projects/">返回作品</a>
    </header>

    <section class="intro" data-intro>
      <div class="intro-copy">
        <p class="kicker">餐廳新人管理遊戲</p>
        <h2>先做這個。<br>然後呢？</h2>
        <p>接單、煮麵、擺盤、送餐，同時處理收桌、補水與臨時支援；在忙碌的班次裡熟悉流程，慢慢找到自己的工作節奏。</p>
        <div class="intro-actions">
          <button class="primary" type="button" data-start>開始第一班</button>
          <button class="text-button" type="button" data-continue hidden>繼續上次進度</button>
        </div>
      </div>
    </section>

    <section class="play" data-play hidden aria-live="polite">
      <div class="shift-bar">
        <div><strong data-period>第 1 班</strong><span data-rush>開店準備</span></div>
        <div class="score"><span>完成 <b data-completed>0</b> 單</span><span>店內評價 <b data-reputation>50</b></span></div>
      </div>

      <nav class="stations" aria-label="工作區">
        <button type="button" data-station="order"><b>1</b>接單</button>
        <button type="button" data-station="cook"><b>2</b>料理</button>
        <button type="button" data-station="plate"><b>3</b>擺盤</button>
        <button type="button" data-station="floor"><b>4</b>店面</button>
      </nav>

      <div class="work-area">
        <section class="station-view" data-view aria-label="目前工作區"></section>
        <aside class="status-rail">
          <section>
            <h2>待辦單</h2>
            <div class="tickets" data-tickets></div>
          </section>
          <section class="counters">
            <p><span>待出餐</span><b data-ready>0</b></p>
            <p><span>店面雜務</span><b data-floor-count>0</b></p>
          </section>
          <section class="notebook">
            <h2>流程小抄 <span data-known-count></span></h2>
            <ol data-notes></ol>
          </section>
        </aside>
      </div>

      <section class="interruption" data-interruption hidden>
        <img src="./assets/coworker.webp" width="1120" height="1301" alt="一位忙碌的資深同事">
        <div><small>同事臨時交代</small><p data-interruption-line></p></div>
        <div class="interruption-actions" data-interruption-actions></div>
      </section>

      <p class="game-note" data-message>先到接單區看看今天的第一張單。</p>
    </section>
  </main>
</body>
</html>
