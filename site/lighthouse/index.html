    .veil { z-index: -3; background: linear-gradient(180deg, rgba(2, 8, 14, .2), transparent 48%, rgba(2, 7, 12, .32)); pointer-events: none; transition: opacity 1.4s ease; }
    .warmth { z-index: -2; opacity: 0; pointer-events: none; background: radial-gradient(ellipse at 34% 33%, rgba(223, 160, 74, .16), transparent 20%), linear-gradient(95deg, transparent 32%, rgba(223, 160, 74, .04) 48%, transparent 76%); mix-blend-mode: screen; transition: opacity 1.8s ease .15s; }
    .mist { z-index: -1; opacity: .22; pointer-events: none; background: radial-gradient(ellipse at 38% 70%, rgba(135, 160, 177, .12), transparent 38%), radial-gradient(ellipse at 70% 48%, rgba(130, 151, 167, .08), transparent 44%); animation: drift 18s ease-in-out infinite alternate; }
    body.is-lit .scene-lit { opacity: 1; transform: scale(1); }
    body.is-lit .warmth { opacity: 1; }
    body.is-lit .veil { opacity: .72; }
    @keyframes drift { from { transform: translate3d(-1.2%, 0, 0) scale(1.02); } to { transform: translate3d(1.2%, -.8%, 0) scale(1.04); } }
    .topbar { position: fixed; z-index: 10; top: max(20px, env(safe-area-inset-top)); left: max(24px, env(safe-area-inset-left)); right: max(24px, env(safe-area-inset-right)); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .wordmark { color: rgba(237, 241, 241, .72); font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .project-link, .lang-button { min-height: 44px; display: inline-flex; align-items: center; border: 0; background: transparent; color: rgba(237, 241, 241, .66); font-size: 12px; text-decoration: none; cursor: pointer; }
    .lang-button { padding: 0; }
    .sound-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .sound-button .sound-on, .sound-button[aria-pressed="true"] .sound-off { display: none; }
    .sound-button[aria-pressed="true"] .sound-on { display: block; }
    .control-zone { position: fixed; z-index: 5; left: 50%; bottom: max(32px, calc(env(safe-area-inset-bottom) + 24px)); width: min(520px, calc(100% - 40px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 18px; text-align: center; }
    .lamp-control { min-height: 48px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 15px; border: 1px solid rgba(207, 221, 229, .18); border-radius: 999px; background: rgba(5, 12, 19, .45); color: rgba(237, 241, 241, .74); font-size: 12px; letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(16px); transition: color .6s, border-color .6s, background .6s; }
    .lamp-control:hover { color: #fff; border-color: rgba(237, 241, 241, .34); }
    .lamp-dot { width: 7px; height: 7px; border-radius: 50%; background: #6d7981; box-shadow: 0 0 0 transparent; transition: background 1.1s, box-shadow 1.1s; }
    body.is-lit .lamp-control { border-color: rgba(223, 160, 74, .28); background: rgba(12, 14, 15, .5); color: #f0d9b7; }
    body.is-lit .lamp-dot { background: #f0b75f; box-shadow: 0 0 16px rgba(223, 160, 74, .7); }
    .note-panel { width: min(420px, 100%); display: grid; gap: 12px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .9s ease .5s, transform .9s cubic-bezier(.16, 1, .3, 1) .5s; }
    body.is-lit .note-panel { opacity: 1; transform: none; pointer-events: auto; }
    .note { width: 100%; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; outline: 0; background: transparent; color: rgba(237, 241, 241, .86); font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 17px; font-style: italic; text-align: center; }
    .note::placeholder { color: rgba(215, 224, 229, .42); }
    .note:focus { border-color: rgba(223, 160, 74, .55); }
    .presence { margin: 0; color: rgba(215, 224, 229, .58); font-size: 11px; letter-spacing: .025em; }
    .quiet { position: fixed; z-index: 5; left: max(24px, env(safe-area-inset-left)); bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px)); margin: 0; color: rgba(215, 224, 229, .34); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .concept { position: fixed; z-index: 5; right: max(24px, env(safe-area-inset-right)); bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px)); margin: 0; color: rgba(215, 224, 229, .26); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    @media (max-width: 700px) {
      .scene-layer { background-position: 31% center; }
      .topbar { left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); }
      .control-zone { bottom: max(62px, calc(env(safe-area-inset-bottom) + 54px)); }
      .quiet, .concept { bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px)); }
      .warmth { background: radial-gradient(ellipse at 34% 33%, rgba(223, 160, 74, .18), transparent 22%), linear-gradient(100deg, transparent 26%, rgba(223, 160, 74, .08) 48%, transparent 92%); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0ms !important; } }
  </style>
</head>

  <main class="scene" aria-label="Lighthouse interactive concept">
    <div class="scene-layer scene-unlit" aria-hidden="true"></div>
    <div class="scene-layer scene-lit" aria-hidden="true"></div>

    <div class="warmth" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <header class="topbar"><span class="wordmark">Lighthouse</span><div class="top-actions"><a class="project-link" href="/projects/lighthouse/"><span data-copy="en">About</span><span data-copy="zh">作品說明</span></a><button class="lang-button sound-button" type="button" data-sound-toggle aria-pressed="false" aria-label="Play background music"><svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="M17 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg><svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z"/><path d="m18 9 4 4M22 9l-4 4"/></svg></button><button class="lang-button" type="button" data-language-toggle aria-label="切換語言">EN / 中</button></div></header>
    <audio data-bgm loop preload="none" src="./assets/lighthouse-bgm.mp3"></audio>
    <div class="control-zone">
      <button class="lamp-control" type="button" data-lamp-toggle aria-pressed="false"><span class="lamp-dot" aria-hidden="true"></span><span data-label><span data-copy="en">Light the lamp</span><span data-copy="zh">點亮燈塔</span></span></button>
      <div class="note-panel">
        <label class="visually-hidden" for="lighthouse-note"><span data-copy="en">Leave a note</span><span data-copy="zh">留一句話</span></label>
        <input class="note" id="lighthouse-note" maxlength="120" autocomplete="off" placeholder="leave a note…">
        <p class="presence"><span data-copy="en">a light was left on · a little while ago</span><span data-copy="zh">有人留了一盞燈 · 不久之前</span></p>
      </div>
    </div>
    <p class="quiet"><span data-copy="en">quiet mode</span><span data-copy="zh">安靜模式</span></p>
    <p class="concept">concept · 2026</p>

      let lit = false;
      let soundOn = false;

      function stored(key) { try { return localStorage.getItem(key); } catch { return null; } }
      function remember(key, value) { try { localStorage.setItem(key, value); } catch {} }
      function applyLanguage(language) {
        const next = language === "zh" ? "zh" : "en";
        root.dataset.lang = next;
        root.lang = next === "zh" ? "zh-Hant" : "en";
        note.placeholder = next === "zh" ? "留一句話…" : "leave a note…";
        toggle.setAttribute("aria-label", lit ? (next === "zh" ? "熄滅燈塔" : "Turn off the lamp") : (next === "zh" ? "點亮燈塔" : "Light the lamp"));
        soundToggle.setAttribute("aria-label", soundOn
          ? (next === "zh" ? "關閉背景音樂" : "Turn background music off")
          : (next === "zh" ? "播放背景音樂" : "Play background music"));
        remember(languageKey, next);
      }
      function applySound(next) {
        soundOn = Boolean(next);
        soundToggle.setAttribute("aria-pressed", String(soundOn));
        if (soundOn) bgm.play().catch(() => {}); else bgm.pause();
        applyLanguage(root.dataset.lang);
      }
      function applyLamp(next) {
        lit = Boolean(next);
        document.body.classList.toggle("is-lit", lit);
        toggle.setAttribute("aria-pressed", String(lit));
        const en = toggle.querySelector('[data-copy="en"]');
        const zh = toggle.querySelector('[data-copy="zh"]');
        en.textContent = lit ? "Let the light rest" : "Light the lamp";
        zh.textContent = lit ? "讓燈光休息" : "點亮燈塔";
        applyLanguage(root.dataset.lang);
      }
      toggle.addEventListener("click", () => applyLamp(!lit));
      languageToggle.addEventListener("click", () => applyLanguage(root.dataset.lang === "zh" ? "en" : "zh"));
      soundToggle.addEventListener("click", () => applySound(!soundOn));
      note.value = stored(noteKey) || "";
      note.addEventListener("input", () => remember(noteKey, note.value));
      applyLanguage(stored(languageKey) || "en");
      applyLamp(false);
    })();
  </script>
</body>
</html>
